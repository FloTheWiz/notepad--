<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* #e4d2aa
#c7b08b
#a08662
#796755
#5a4e44
#423934 */
    --bg: #fff0f2;
    --accent: #a08662;
    --text: #03090e;
    --muted: #423934;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
    background: var(--bg);
  }

  .wrap{
    max-width: 90vw;
    height: 100vh;
    margin: 0 auto;
    padding: 6vh 24px 4vh;
    display: flex;
    flex-direction: column;
  }

  .bar{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 14px;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(243,233,222,0.1);
    transition: border-color 0.3s ease;
  }

  .wrap:focus-within .bar,
  .wrap:focus-within .foot{
    border-color: rgba(205,161,90,0.35);
  }

  .title{
    margin: 0;
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.15rem;
    color: var(--text);
  }

  .status{
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    color: var(--accent);
    opacity: 0;
    min-width: 60px;
    text-align: right;
    transition: opacity 0.5s ease;
  }

  .pad{
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 1.15rem;
    line-height: 1.8;
    caret-color: var(--accent);
    padding: 0;
  }

  .pad::placeholder{
    color: var(--muted);
    font-style: italic;
  }

  .pad::selection{
    background: rgba(205,161,90,0.28);
    color: var(--text);
  }

  .foot{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid rgba(243,233,222,0.1);
    transition: border-color 0.3s ease;
  }

  .count{
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .download{
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: var(--accent);
    background: none;
    border: none;
    border-bottom: 1px solid rgba(205,161,90,0.4);
    padding: 2px 1px;
    cursor: pointer;
    transition: border-color 0.3s ease, color 0.3s ease;
  }

  .download:hover{
    border-color: var(--accent);
    color: var(--text);
  }

  .download:focus-visible,
  .pad:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (max-width: 520px){
    .wrap{ padding: 4vh 18px 3vh; }
    .pad{ font-size: 1.05rem; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <h1 class="title">Notepad</h1>
    <span class="status" id="status"></span>
  </div>

  <textarea class="pad" id="pad" aria-label="Scratchpad content" placeholder="start writing…" spellcheck="false"></textarea>

  <div class="foot">
    <span class="count" id="count">0 words</span>
    <button class="download" id="downloadBtn">Download</button>
  </div>
</div>

<script>
  const pad = document.getElementById('pad');
  const statusEl = document.getElementById('status');
  const countEl = document.getElementById('count');
  const downloadBtn = document.getElementById('downloadBtn');
  const STORAGE_KEY = 'scratchpad-content';

  let saveTimer = null;
  let fadeTimer = null;

  function setStatus(text){
    statusEl.textContent = text;
    statusEl.style.opacity = text ? '1' : '0';
  }

  function updateCount(){
    const words = pad.value.trim().split(/\s+/).filter(Boolean);
    countEl.textContent = `${words.length} word${words.length === 1 ? '' : 's'}`;
  }

  function save(){
  	try{
  		localStorage.setItem(STORAGE_KEY, pad.value);
  		setStatus('saved');
  	}catch(e){
  		console.error('save failed', e);
  		setStatus('');
  	}
  
  	clearTimeout(fadeTimer);
  	fadeTimer = setTimeout(() => setStatus(''), 1800);
  }

  function scheduleSave(){
    setStatus('saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 700);
  }

  pad.addEventListener('input', () => {
    updateCount();
    scheduleSave();
  });

  function downloadPad(){
    const blob = new Blob([pad.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `scratchpad-${stamp}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  downloadBtn.addEventListener('click', downloadPad);

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
      e.preventDefault();
      downloadPad();
    }
  });
  (() => {
  	try{
  		const value = localStorage.getItem(STORAGE_KEY);
  
  		if (typeof value === 'string'){
  			pad.value = value;
  		}
  	}catch(e){
  		console.error('load failed', e);
  	}finally{
  		updateCount();
  	}
  })();
</script>

</body>
</html>
